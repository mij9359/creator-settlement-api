#spring.application.name=creator-settlement-api

spring:
  datasource:
    url: jdbc:h2:mem:settlement;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
    type: com.zaxxer.hikari.HikariDataSource
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

mybatis:
  type-aliases-package: com.min9359.creator_settlement_api.domain
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

server:
  port: 8080

settlement:
  fee-rate: 0.20


decorator:
  datasource:
    p6spy:
      enable-logging: true
      logging: slf4j
      multiline: true

