#spring.application.name=creator-settlement-api

spring:
  datasource:
    url: jdbc:h2:mem:settlement;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
    sql:
      init:
        mode: always
        schema-locations: classpath:schema.
        data-locations: classpath:data.sql

mybatis:
  type-aliases-package: com.mij9359.creator_settlement_api.domain
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080